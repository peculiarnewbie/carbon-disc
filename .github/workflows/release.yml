name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: x86_64-linux
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: x86_64-windows
            ext: ".exe"
          - os: macos-14
            target: x86_64-apple-darwin
            platform: x86_64-macos
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      # One build per OS feeds both archives: the slim one ships the bare app,
      # the full one adds FFmpeg and licenses. The binaries are identical.
      - name: Assemble slim bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="carbon-disc-v${version}-slim-${{ matrix.platform }}"
          mkdir -p bundle
          cp "target/${{ matrix.target }}/release/carbon-disc${{ matrix.ext }}" "bundle/carbon-disc${{ matrix.ext }}"
          cp packaging/README-slim.txt bundle/README.txt
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p bundle/share/applications
            cp packaging/carbon-disc.desktop bundle/share/applications/
            for size in 16 32 48 64 128 256; do
              mkdir -p "bundle/share/icons/hicolor/${size}x${size}/apps"
              cp "assets/logo-${size}.png" "bundle/share/icons/hicolor/${size}x${size}/apps/carbon-disc.png"
            done
          fi
          mv bundle "$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "$name"
          else
            tar -czf "${name}.tar.gz" "$name"
          fi
          rm -rf "$name"

      - name: Fetch FFmpeg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p bundle
          curl -fsSLo ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe bundle/
          cp ffmpeg-master-latest-linux64-gpl/LICENSE.txt bundle/FFmpeg-LICENSE.txt

      - name: Fetch FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bundle
          curl -fsSLo ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip
          7z e ffmpeg.zip -y -obundle "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"

      - name: Fetch FFmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p bundle
          base="https://evermeet.cx/ffmpeg"
          page=$(curl -fsSL "$base/")
          ffmpeg_zip=$(grep -oE 'href="ffmpeg-[0-9][^"]*\.zip"' <<<"$page" | head -1 | cut -d'"' -f2)
          ffprobe_zip=$(grep -oE 'href="ffprobe-[0-9][^"]*\.zip"' <<<"$page" | head -1 | cut -d'"' -f2)
          test -n "$ffmpeg_zip" && test -n "$ffprobe_zip"
          curl -fsSLO "$base/$ffmpeg_zip"
          curl -fsSLO "$base/$ffprobe_zip"
          unzip -o "$ffmpeg_zip" -d bundle/
          unzip -o "$ffprobe_zip" -d bundle/
          chmod +x bundle/ffmpeg bundle/ffprobe

      - name: Assemble full bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="carbon-disc-v${version}-${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/carbon-disc${{ matrix.ext }}" "bundle/carbon-disc${{ matrix.ext }}"
          cp packaging/README.txt packaging/THIRD-PARTY-NOTICES.md bundle/
          cp packaging/COPYING.GPL-2.0 bundle/COPYING.GPL-2.0
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p bundle/share/applications
            cp packaging/carbon-disc.desktop bundle/share/applications/
            for size in 16 32 48 64 128 256; do
              mkdir -p "bundle/share/icons/hicolor/${size}x${size}/apps"
              cp "assets/logo-${size}.png" "bundle/share/icons/hicolor/${size}x${size}/apps/carbon-disc.png"
            done
          fi
          "bundle/ffmpeg${{ matrix.ext }}" -version > bundle/ffmpeg-version.txt
          mv bundle "$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${name}.zip" "$name"
          else
            tar -czf "${name}.tar.gz" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            carbon-disc-v*.tar.gz
            carbon-disc-v*.zip

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # GitHub orders assets alphabetically, so the slim builds carry the
          # `slim-` prefix and sort above the full bundles.
          body: |
            ## Downloads

            **Slim builds** (`slim-…` in the name) are the small downloads. They do
            **not** include FFmpeg: on first launch Carbon Disc opens a setup screen
            with per-platform install instructions (winget, Homebrew, or your Linux
            package manager).

            **Full builds** (bottom of the asset list) come with FFmpeg included, so
            they work out of the box at the cost of a much larger download.

            Both are the same application — pick slim unless you want FFmpeg bundled.
          generate_release_notes: true
          files: release/*
