name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: slim-x86_64-linux
            ext: ""
            slim: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: slim-x86_64-windows
            ext: ".exe"
            slim: true
          - os: macos-14
            target: x86_64-apple-darwin
            platform: slim-x86_64-macos
            ext: ""
            slim: true
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: x86_64-linux
            ext: ""
            slim: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: x86_64-windows
            ext: ".exe"
            slim: false
          - os: macos-14
            target: x86_64-apple-darwin
            platform: x86_64-macos
            ext: ""
            slim: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Stage app binary
        shell: bash
        run: |
          mkdir -p bundle
          cp "target/${{ matrix.target }}/release/carbon-disc${{ matrix.ext }}" "bundle/carbon-disc${{ matrix.ext }}"

      - name: Fetch FFmpeg (Linux)
        if: runner.os == 'Linux' && !matrix.slim
        shell: bash
        run: |
          curl -fsSLo ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe bundle/
          cp ffmpeg-master-latest-linux64-gpl/LICENSE.txt bundle/FFmpeg-LICENSE.txt

      - name: Fetch FFmpeg (Windows)
        if: runner.os == 'Windows' && !matrix.slim
        shell: bash
        run: |
          curl -fsSLo ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip
          7z e ffmpeg.zip -y -obundle "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"

      - name: Fetch FFmpeg (macOS)
        if: runner.os == 'macOS' && !matrix.slim
        shell: bash
        run: |
          base="https://evermeet.cx/ffmpeg"
          page=$(curl -fsSL "$base/")
          ffmpeg_zip=$(grep -oE 'href="ffmpeg-[0-9][^"]*\.zip"' <<<"$page" | head -1 | cut -d'"' -f2)
          ffprobe_zip=$(grep -oE 'href="ffprobe-[0-9][^"]*\.zip"' <<<"$page" | head -1 | cut -d'"' -f2)
          test -n "$ffmpeg_zip" && test -n "$ffprobe_zip"
          curl -fsSLO "$base/$ffmpeg_zip"
          curl -fsSLO "$base/$ffprobe_zip"
          unzip -o "$ffmpeg_zip" -d bundle/
          unzip -o "$ffprobe_zip" -d bundle/
          chmod +x bundle/ffmpeg bundle/ffprobe

      - name: Assemble bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd bundle
          if [ "${{ matrix.slim }}" = "true" ]; then
            cp ../packaging/README-slim.txt README.txt
          else
            cp ../packaging/README.txt ../packaging/THIRD-PARTY-NOTICES.md .
            cp ../packaging/COPYING.GPL-2.0 COPYING.GPL-2.0
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p share/applications
            cp ../packaging/carbon-disc.desktop share/applications/
            for size in 16 32 48 64 128 256; do
              mkdir -p "share/icons/hicolor/${size}x${size}/apps"
              cp "../assets/logo-${size}.png" "share/icons/hicolor/${size}x${size}/apps/carbon-disc.png"
            done
          fi
          if [ "${{ matrix.slim }}" != "true" ]; then
            "./ffmpeg${{ matrix.ext }}" -version > ffmpeg-version.txt
            cat ffmpeg-version.txt
          fi
          cd ..
          ext="tar.gz"
          mv bundle "carbon-disc-v${version}-${{ matrix.platform }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            ext="zip"
            7z a "carbon-disc-v${version}-${{ matrix.platform }}.zip" "carbon-disc-v${version}-${{ matrix.platform }}"
          else
            tar -czf "carbon-disc-v${version}-${{ matrix.platform }}.tar.gz" "carbon-disc-v${version}-${{ matrix.platform }}"
          fi
          rm -rf "carbon-disc-v${version}-${{ matrix.platform }}"
          echo "ext=$ext" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            carbon-disc-v*.tar.gz
            carbon-disc-v*.zip

  publish:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # GitHub orders assets alphabetically, so the slim builds carry the
          # `slim-` prefix and sort above the full bundles.
          body: |
            ## Downloads

            **Slim builds** (`slim-…` in the name) are the small downloads. They do
            **not** include FFmpeg: on first launch Carbon Disc opens a setup screen
            with per-platform install instructions (winget, Homebrew, or your Linux
            package manager).

            **Full builds** (bottom of the asset list) come with FFmpeg included, so
            they work out of the box at the cost of a much larger download.

            Both are the same application — pick slim unless you want FFmpeg bundled.
          generate_release_notes: true
          files: release/*
