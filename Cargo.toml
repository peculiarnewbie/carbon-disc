[package]
name = "carbon-disc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A friendly, open-source video transcoder powered by FFmpeg"
repository = "https://github.com/carbon-disc/carbon-disc"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
directories = "6"
eframe = "0.35"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
